server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退，保证任意路径都返回入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
